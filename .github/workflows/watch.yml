name: weekly-watch

# Deterministic weekly run: no AI, no API key. State (snapshots + reports) is committed to the
# orphan branch `watchdog-data`, never to the code branch and never kept only in Actions cache.
# See docs/weekly-automation.md.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC (GitHub cron is always UTC). Off the hour on purpose.
  workflow_dispatch:

# One run at a time: two runs would race on the state branch. A queued run waits, never cancels.
concurrency:
  group: docs-watchdog-state
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATA_BRANCH: watchdog-data

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # only to push the data branch
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure the data branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" "$DATA_BRANCH" >/dev/null 2>&1; then
            echo "data branch exists"
          else
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q -b "$DATA_BRANCH"
            printf '# watchdog-data\n\nGenerated by the weekly-watch workflow: snapshots and reports.\nDo not edit by hand; see docs/weekly-automation.md.\n' > "$tmp/README.md"
            git -C "$tmp" add README.md
            git -C "$tmp" -c user.name="docs-watchdog[bot]" -c user.email="docs-watchdog@users.noreply.github.com" commit -q -m "Initialise data branch"
            git -C "$tmp" push -q "$url" "$DATA_BRANCH"
          fi

      - name: Check out the state (data branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DATA_BRANCH }}
          path: state

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # within requires-python (>=3.11)
          cache: pip # download cache only; state never depends on it

      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e '.[dev,browser]'
          playwright install --with-deps chromium

      - name: Tests
        run: pytest -q

      - name: Validate configuration
        run: docs-watchdog --validate-only

      - name: Run monitor (deterministic mode)
        id: monitor
        run: docs-watchdog --no-llm --state-dir state --out state/reports

      - name: Job summary
        if: always()
        run: |
          if [ -f state/reports/latest.md ]; then cat state/reports/latest.md >> "$GITHUB_STEP_SUMMARY"; \
          else echo "No report was produced: the run failed before reporting." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Persist state to the data branch
        if: always() && steps.monitor.conclusion != 'skipped'
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name "docs-watchdog[bot]"
          git config user.email "docs-watchdog@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to persist"; exit 0; fi
          git commit -q -m "watch: ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${DATA_BRANCH}"; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing on the remote data branch"
            git pull --rebase origin "${DATA_BRANCH}"
          done
          echo "::error::could not push state to ${DATA_BRANCH}"; exit 1

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: state/reports/
          if-no-files-found: warn
